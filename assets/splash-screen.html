<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #bff6dc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        .splash-container {
            text-align: center;
        }
        .app-name {
            color: #2d5a3d;
            font-size: 24px;
            margin-top: 20px;
            font-weight: bold;
        }
        .logo {
            width: 120px;
            height: 120px;
            border-radius: 30px;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .leaf-icon {
            font-size: 60px;
            color: #4CAF50;
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="logo">
            <div class="leaf-icon">🌿</div>
        </div>
        <div class="app-name">LeafNest</div>
    </div>
</body>
</html>
